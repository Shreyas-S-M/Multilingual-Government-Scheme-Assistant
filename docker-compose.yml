version: '3.8'

services:
  backend:
    build: .
    container_name: scheme_assistant_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:////app/data/processed/scheme_assistant.db
      - FAISS_INDEX_PATH=/app/data/processed/faiss_index.bin
      - INDEX_METADATA_PATH=/app/data/processed/index_metadata.json
      - SCHEMES_DATA_DIR=/app/data/schemes
      - LLM_PROVIDER=deterministic
      - ADMIN_API_KEY=admin-secret-dev-key-change-in-production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: .
    container_name: scheme_assistant_frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
